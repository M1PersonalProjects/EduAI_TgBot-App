<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Интерактивное задание — EduAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/app.css?v=20260814-tz29-1">
  <link rel="stylesheet" href="/static/css/interactive.css?v=20260815-tz30-2">
</head>
<body data-interactive-app-id="{{ app_id }}">
  <main class="interactive-shell">
    <header class="glass interactive-toolbar">
      <div class="min-w-0">
        <p class="text-xs font-bold uppercase tracking-[.16em] muted">EduAI · Интерактивное задание</p>
        <h1 id="interactive-title" class="truncate text-lg font-extrabold">Загрузка…</h1>
        <p id="interactive-version" class="text-xs muted"></p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="interactive-download" class="btn-secondary" type="button">Скачать HTML</button>
        <button id="interactive-back" class="btn-primary" type="button">Назад</button>
      </div>
    </header>

    <section class="glass interactive-stage">
      <div id="interactive-loading" class="interactive-loading">Загружаем интерактивное задание…</div>
      <iframe
        id="interactive-frame"
        title="Интерактивное задание EduAI"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer"
        hidden
      ></iframe>
    </section>

    <p id="interactive-result" class="interactive-result" hidden></p>
  </main>
  <script src="/static/js/app.js?v=20260814-tz29-1"></script>
  <script src="/static/js/interactive.js?v=20260815-tz30-2"></script>
</body>
</html>
